# SUPERSEDED bởi residual_prereg_v1.yaml (D25) — không dùng config này nữa.
# Cấu hình residual & CQR (§5.3, §5.4 trong KE_HOACH_V4)

# === Residual model ===
model: xgboost                # Chính: xgboost; ablation: mlp

# === XGBoost ===
xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 20
  # Tuning bằng grouped CV theo drive trong B

# === MLP (ablation) ===
mlp:
  hidden_layers: [128, 64]
  activation: relu
  dropout: 0.1
  lr: 0.001
  epochs: 200
  batch_size: 256

# === CQR ===
cqr:
  alpha: 0.1                  # Nominal miscoverage rate (→ 90% coverage)
  quantiles: [0.05, 0.95]     # Lower and upper quantile for quantile regression
  n_resplits: 20              # Số lần chia lại B∪C theo drive để đánh giá stability

# === Mondrian CQR (ablation) ===
mondrian:
  n_bins: 5                   # Bin theo Ẑ (biến quan sát được)
  min_samples_per_bin: 50     # Gộp bin nếu thiếu mẫu

# === Features (§5.3) ===
# Chỉ dùng thông tin có lúc suy luận
features:
  bbox: [w, h, w_h_ratio, y_bottom_minus_cy, cx_offset_norm]
  class: true
  confidence: true
  edge_flags: [left, right, top, bottom]  # Bbox chạm biên ảnh
  geometry_cues: [ln_Z_w, ln_Z_h, ln_Z_g]
  validity_flags: [valid_w, valid_h, valid_g]
