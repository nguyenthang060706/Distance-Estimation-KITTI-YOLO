# Cấu hình huấn luyện chung cho 3 detector (§2, §5.1 trong KE_HOACH_V4)
# YOLOv5su, YOLOv8s, YOLO11s dùng CHUNG file config này

# === Chung ===
seed: 42
imgsz: 640                    # ✅ Đã chốt theo D5 và Pilot (Car mAP@0.5:0.95 = 0.526, 36s/epoch, VRAM 3.66GB)
epochs: 100
patience: 15                  # Early stopping trên V
batch: 16                     # Điều chỉnh theo VRAM (RTX 5060 8GB)
workers: 4

# === Pretrained ===
pretrained: true              # Từ trọng số COCO

# === Augmentation (giữ mặc định Ultralytics) ===
# Không custom augmentation để đảm bảo công bằng giữa 3 detector

# === NMS ===
nms_conf: 0.001               # Confidence threshold cho NMS (thấp, lọc sau)
nms_iou: 0.7                  # IoU threshold cho NMS

# === Conf threshold (chốt trên V) ===
# D6: Cùng quy tắc F1 tối đa của Car trên V, nhưng áp riêng cho từng detector
# (do điểm tin cậy của các detector không cùng thang).
conf_threshold: null           # ⏳ Sẽ xác định riêng cho từng detector theo F1 max (Car trên V)

# === Classes ===
# Train all 3 vehicle classes; Car is primary, Van/Truck reported separately.
# Pedestrian/Cyclist become background (excluded from YOLO labels).
# Hard filter applies to evaluation (B/C/T) only, NOT to training labels.
classes:
  - Car
  - Van
  - Truck

# === Hardware ===
device: 0                     # GPU 0 (RTX 5060)
amp: true                     # Mixed precision (FP16)
