# configs/geometry_params.yaml
# Frozen geometric priors and log-space fusion parameters (Decision D10, git tag: geometry-v1)
# 
# Parameter derivation:
# - Priors (W_eff, H_obj, H_cam, delta_horizon): Estimated strictly from Split A.
#   - H_cam (2.0422m) and delta_horizon (-4.6782px) are EFFECTIVE ground-plane parameters
#     mapping 2D bottom bbox contact to 3D center location (Decision D10).
#   - Diagnostic physical test: when fitting to closest bottom corner Z, H_cam=1.72m and delta=0.52px.
# - Log-space Fusion weights (Z_w, Z_h, Z_g): Estimated strictly from Split B
#   using Ledoit-Wolf covariance shrinkage on leave-one-drive-out residuals (10 drives with Car Hard).
# - Split T is strictly guarded and never touched during calibration or fitting.

metadata:
  tag: "geometry-v1"
  decisions: ["D9", "D10"]
  target_class: "Car"
  filter_level: "Hard"
  split_A_hash: "4402edf8e460fe787721bb7f6cf4a570d94373bb9382113c1ec1fc13017ae87d"
  split_B_hash: "1242dd3521f1b561b7a8adcfa5a412b8517ba3fa6da7a571115fecdf482db0a3"
  split_A_frames: 3740
  split_B_frames: 1496

priors_split_A:
  W_eff: 2.6184078808356097      # Median effective width (m)
  H_obj: 1.679745909326706       # Median object height (m)
  effective_ground_plane:
    H_cam_effective: 2.0422      # Effective camera height for center Z (m)
    delta_horizon: -4.6782       # Effective horizon offset: y_h = cy + delta (px)
    huber_epsilon: 1.35
  physical_diagnostic:
    H_cam_closest_corner: 1.7217 # True camera height when ranging to closest contact corner (m)
    delta_closest_corner: 0.5225 # Horizon offset when ranging to closest corner (px)

masking:
  border_eps_px: 2.0
  per_image_dimensions: true     # Must read exact per-image (width, height)
  mask_rules:
    Z_w: "x1 <= eps or x2 >= width - 1 - eps"
    Z_h: "y1 <= eps or y2 >= height - 1 - eps"
    Z_g: "y1 <= eps or y2 >= height - 1 - eps or y2 <= cy + delta + eps"

fusion_split_B:
  cue_order: ["Z_w", "Z_h", "Z_g"]
  weights: [0.0691, 0.6500, 0.2809]
  shrinkage_alpha: 0.0009
  evaluation_mode: "in-sample"   # Evaluated in-sample on Split B (10 drives with Car Hard)
  covariance_shrunk:
    - [0.12648, 0.01524, 0.01138]
    - [0.01524, 0.00977, 0.00392]
    - [0.01138, 0.00392, 0.02419]
